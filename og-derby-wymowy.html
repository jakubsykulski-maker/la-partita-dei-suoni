<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Partita dei Suoni OG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #9dcdb6;
    color: #171717;
    font-family: 'Fredoka', system-ui, sans-serif;
  }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 58px 68px;
    background:
      radial-gradient(circle at 8% 10%, rgba(255,255,255,0.95) 0 58px, transparent 60px),
      radial-gradient(circle at 88% 12%, rgba(255,255,255,0.9) 0 72px, transparent 74px),
      radial-gradient(circle at 78% 84%, rgba(255,255,255,0.65) 0 46px, transparent 48px),
      linear-gradient(180deg, #9dcdb6 0 56%, #fff8eb 56%);
  }
  .pitch {
    position: absolute;
    left: -70px;
    right: -70px;
    bottom: -160px;
    height: 305px;
    transform: rotate(-2deg);
    background:
      linear-gradient(90deg, rgba(255,255,255,0.25) 2px, transparent 2px),
      linear-gradient(0deg, rgba(255,255,255,0.19) 2px, transparent 2px),
      radial-gradient(circle at 50% 50%, transparent 0 72px, rgba(255,255,255,0.42) 74px 78px, transparent 80px),
      linear-gradient(135deg, #5ea174, #357057);
    background-size: 82px 82px, 82px 82px, auto, auto;
    border-top: 10px solid rgba(255,255,255,0.6);
  }
  .topline {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 18px;
    color: #2d6755;
    font-family: 'DM Mono', monospace;
    font-size: 24px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .topline::before,
  .topline::after {
    content: "";
    width: 62px;
    height: 9px;
    border-radius: 99px;
    background: #f4c84a;
  }
  h1 {
    position: relative;
    z-index: 1;
    margin-top: 24px;
    max-width: 670px;
    color: white;
    font-size: 140px;
    line-height: 0.82;
    text-transform: uppercase;
    text-shadow: 10px 12px 0 #2d6755;
  }
  h1 span {
    display: block;
    color: #f4c84a;
    text-shadow: 10px 12px 0 #171717;
  }
  .subtitle {
    position: relative;
    z-index: 1;
    max-width: 660px;
    margin-top: 26px;
    font-size: 34px;
    line-height: 1.05;
    color: #24483d;
  }
  .scoreboard {
    position: absolute;
    z-index: 2;
    right: 68px;
    top: 86px;
    width: 330px;
    overflow: hidden;
    border-radius: 24px;
    background: #fff8eb;
    border: 4px solid rgba(23,23,23,0.16);
    box-shadow: 0 28px 45px rgba(23,23,23,0.18);
  }
  .score-head {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 14px;
    align-items: center;
    padding: 22px;
    background: #171717;
    color: white;
  }
  .score {
    color: #f4c84a;
    font-size: 52px;
    line-height: 1;
  }
  .crest {
    width: 86px;
    height: 86px;
    border-radius: 50%;
    border: 5px solid white;
    overflow: hidden;
    display: grid;
    place-items: center;
    background: white;
    font-size: 34px;
    font-weight: 700;
  }
  .crest img {
    width: 78%;
    height: 78%;
    object-fit: contain;
  }
  .crest.lech img {
    width: 90%;
    height: 90%;
  }
  .labels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 18px 22px 22px;
    font-family: 'DM Mono', monospace;
    font-size: 19px;
    line-height: 1.2;
    text-transform: uppercase;
  }
  .tag {
    position: absolute;
    z-index: 3;
    right: 74px;
    bottom: 70px;
    padding: 16px 24px;
    border-radius: 999px;
    background: #dc2626;
    color: white;
    font-family: 'DM Mono', monospace;
    font-size: 22px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="pitch"></div>
    <div class="topline">private dad training</div>
    <h1>La Partita <span>dei Suoni</span></h1>
    <p class="subtitle">Polish reading training for an Italian dad. Football drills, hard sounds, bedtime-story trophy.</p>
    <div class="scoreboard">
      <div class="score-head">
        <div class="crest juve"><img src="juventus-logo.png" alt="Juventus logo"></div>
        <div class="score">0:1</div>
        <div class="crest lech"><img src="lech-logo.png" alt="Lech Poznan logo"></div>
      </div>
      <div class="labels">
        <span>Juventus spirit</span>
        <span>Lech challenge</span>
      </div>
    </div>
    <div class="tag">4 weeks · 15 min/day</div>
  </div>
</body>
</html>
